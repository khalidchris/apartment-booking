<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Tour - Modern Apartments</title>
<link rel="stylesheet" href="css/styles.css">
<style>
body { margin:0; font-family: Arial, sans-serif; background-color:#f5f5f5; }
header { background-color:#004080; color:#fff; padding:1rem 0; }
nav ul { display:flex; justify-content:center; list-style:none; flex-wrap:wrap; }
nav ul li { margin:0 1rem; }
nav ul li a { color:#fff; text-decoration:none; font-weight:bold; }
nav ul li a:hover { text-decoration:underline; }
section h1 { text-align:center; color:#004080; margin:1rem 0; }
#wizard { max-width:800px; margin:2rem auto; background:#fff; padding:2rem; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.step { display:none; }
.step.active { display:block; animation:fadeIn 0.5s; }
button { background-color:#004080; color:#fff; border:none; padding:0.6rem 1.2rem; border-radius:5px; cursor:pointer; font-weight:bold; margin-top:1rem; transition:0.3s; }
button:hover { background-color:#003366; }
.unit-card { background-color:#f0f0f0; padding:1rem; border-radius:8px; margin:0.5rem 0; cursor:pointer; border:2px solid transparent; transition:0.3s; }
.unit-card.selected { border-color:#004080; background-color:#e0f0ff; }
input, select { width:100%; padding:0.5rem; margin:0.5rem 0; border-radius:5px; border:1px solid #ccc; }
.confirmation { text-align:center; padding:2rem; color:#004080; font-size:1.2rem; }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
</style>
</head>
<body>
<header>
    <nav>
        <ul>
              <li><a href="index.html">Home</a></li>
                <li><a href="floors.html">Floor Plans & Rates</a></li>
                <li><a href="availability.html">Availability</a></li>
                <li><a href="amenities.html">Amenities</a></li>
                <li><a href="schedule.html">Schedule Tour</a></li>
                <li><a href="apply.html">Apply Online</a></li>
                <li><a href="resident.html">Resident Portal</a></li>
        </ul>
    </nav>
</header>

<section>
    <h1>Schedule a Tour</h1>
    <div id="wizard">
        <!-- Step 1: Select Unit -->
        <div class="step active" id="step1">
            <h2>Select a Unit</h2>
            <div class="unit-card" onclick="selectUnit(this,'1-Bedroom')">1-Bedroom Apartment</div>
            <div class="unit-card" onclick="selectUnit(this,'2-Bedroom')">2-Bedroom Apartment</div>
            <div class="unit-card" onclick="selectUnit(this,'Studio')">Studio Apartment</div>
            <button onclick="nextStep()">Next</button>
        </div>

        <!-- Step 2: Pick Date -->
        <div class="step" id="step2">
            <h2>Pick a Date</h2>
            <input type="date" id="tourDate">
            <button onclick="prevStep()">Back</button>
            <button onclick="nextStep()">Next</button>
        </div>

        <!-- Step 3: Enter Info -->
        <div class="step" id="step3">
            <h2>Your Information</h2>
            <input type="text" id="name" placeholder="Your Name">
            <input type="email" id="email" placeholder="Email">
            <input type="tel" id="phone" placeholder="Phone Number">
            <button onclick="prevStep()">Back</button>
            <button onclick="submitTour()">Confirm</button>
        </div>

        <!-- Step 4: Confirmation -->
        <div class="step" id="step4">
            <div class="confirmation" id="confirmationMessage"></div>
        </div>
    </div>
</section>

<footer style="background-color:#222; color:#fff; text-align:center; padding:1rem 0; margin-top:2rem;">
    <p>© 2025 Modern Apartment Complex. All rights reserved.</p>
</footer>

<script>
let currentStep = 1;
let selectedUnit = '';
function nextStep(){
    document.getElementById('step'+currentStep).classList.remove('active');
    currentStep++;
    document.getElementById('step'+currentStep).classList.add('active');
}
function prevStep(){
    document.getElementById('step'+currentStep).classList.remove('active');
    currentStep--;
    document.getElementById('step'+currentStep).classList.add('active');
}
function selectUnit(element, unitName){
    document.querySelectorAll('.unit-card').forEach(card=>card.classList.remove('selected'));
    element.classList.add('selected');
    selectedUnit = unitName;
}
function submitTour(){
    const date = document.getElementById('tourDate').value;
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    if(!selectedUnit || !date || !name || !email){
        alert('Please fill all required fields and select a unit');
        return;
    }
    document.getElementById('step3').classList.remove('active');
    currentStep++;
    document.getElementById('step4').classList.add('active');
    document.getElementById('confirmationMessage').innerHTML = `Thank you, <b>${name}</b>!<br>Your tour for <b>${selectedUnit}</b> on <b>${date}</b> is confirmed.`;
}
</script>
</body>
</html>
